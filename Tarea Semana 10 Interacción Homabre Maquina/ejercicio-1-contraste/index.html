<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicio 1 - Calculadora de contraste</title>
  <style>
    body { font-family: Arial, sans-serif; background: #F5F5F5; color: #1F1F1F; margin: 0; padding: 20px; }
    .tarjeta { background: white; border-radius: 10px; padding: 16px; max-width: 520px; }
    label { font-weight: bold; margin-right: 8px; }
    input { width: 70px; height: 40px; vertical-align: middle; }
    .fila { margin: 10px 0; }
    button { font-size: 18px; padding: 10px 16px; margin-top: 8px; cursor: pointer; }
    .muestra { font-size: 20px; padding: 16px; border-radius: 8px; margin-top: 16px; }
    .resultado { font-size: 22px; font-weight: bold; margin-top: 12px; }
    .cumple { color: #2E7D32; }
    .no-cumple { color: #B3261E; }
  </style>
</head>
<body>
  <h1>Ejercicio 1: calculadora de contraste</h1>
  <p>El botón «Pagar matrícula» usa texto blanco y fondo verde claro. El mínimo para texto normal es 4.5 a 1.</p>
  <div class="tarjeta">
    <div class="fila">
      <label for="color-texto">Color del texto:</label>
      <input type="color" id="color-texto" value="#ffffff">
    </div>
    <div class="fila">
      <label for="color-fondo">Color del fondo:</label>
      <input type="color" id="color-fondo" value="#4caf50">
    </div>
    <button id="calcular">Calcular contraste</button>
    <div class="muestra" id="muestra">Pagar matrícula</div>
    <p class="resultado" id="resultado"></p>
  </div>
  <p>Con los colores iniciales el resultado es 2.78 a 1 y no cumple. Prueba elegir un verde más oscuro, por ejemplo <code>#2E7D32</code>.</p>
  <script>
    function luminancia(colorHex) {
      var rojo = parseInt(colorHex.substring(1, 3), 16);
      var verde = parseInt(colorHex.substring(3, 5), 16);
      var azul = parseInt(colorHex.substring(5, 7), 16);
      function corregir(valor) {
        var c = valor / 255;
        if (c <= 0.04045) return c / 12.92;
        return Math.pow((c + 0.055) / 1.055, 2.4);
      }
      return 0.2126 * corregir(rojo) + 0.7152 * corregir(verde) + 0.0722 * corregir(azul);
    }
    function contraste(color1, color2) {
      var l1 = luminancia(color1);
      var l2 = luminancia(color2);
      var claro = Math.max(l1, l2);
      var oscuro = Math.min(l1, l2);
      return (claro + 0.05) / (oscuro + 0.05);
    }
    document.getElementById('calcular').addEventListener('click', function () {
      var texto = document.getElementById('color-texto').value;
      var fondo = document.getElementById('color-fondo').value;
      var muestra = document.getElementById('muestra');
      muestra.style.color = texto;
      muestra.style.background = fondo;
      var valor = contraste(texto, fondo).toFixed(2);
      var resultado = document.getElementById('resultado');
      if (valor >= 4.5) {
        resultado.textContent = 'Contraste ' + valor + ' a 1: cumple (mínimo 4.5)';
        resultado.className = 'resultado cumple';
      } else {
        resultado.textContent = 'Contraste ' + valor + ' a 1: no cumple (mínimo 4.5)';
        resultado.className = 'resultado no-cumple';
      }
    });
  </script>
</body>
</html>
